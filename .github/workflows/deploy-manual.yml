name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  NODE_VERSION: '23.11.1'
  BUILD_MODE: release

jobs:
  validate-confirmation:
    name: Validate manual confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "yes" ]; then
            echo 'Deployment blocked: confirm_deploy must be exactly "yes".'
            exit 1
          fi

  preflight:
    name: Release preflight
    needs: validate-confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check release metadata
        run: node scripts/release/check-release.js

      - name: Run release checks
        run: |
          yarn format
          yarn build
          yarn lint
          node scripts/check-packages.js
          yarn typecheck
          yarn test:unit --single-run
          yarn test:compat:tsc
          yarn test:compat:ssr

      - name: Build bundle
        run: yarn build:bundle

      - name: Verify ES5 compatibility of the legacy bundle
        run: yarn test:compat:es5

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: packages/*/bundle/**
          if-no-files-found: error

  deploy-prod:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download verified bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: packages

      - name: Get version
        run: |
          FULL_VERSION=$(node -p "require('./lerna.json').version")
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Deploy to prod
        run: node ./scripts/deploy/deploy-oss.js prod v${VERSION}
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}

  publish-npm:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish to NPM
        run: node ./scripts/deploy/publish-npm.js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-success:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Prepare notification
        run: |
          COMMIT_MESSAGE=$(git show-branch --no-name HEAD)
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "COMMIT_URL=https://github.com/${{ github.repository }}/commit/${{ github.sha }}" >> $GITHUB_ENV

      - name: Notify deployment success
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
                "markdown": {
                "title": "RUM sdk 部署通知",
                "text": "### ✅ RUM sdk 部署成功\n\n---\n\n 🔖 分支: ${{ github.ref }}\n\n 📝 提交信息: [${{ github.event.head_commit.message }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n\n 👨‍💻 提交者: ${{ github.actor }}\n\n 🚀 [查看部署详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

  notify-failure:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Prepare notification
        run: |
          COMMIT_MESSAGE=$(git show-branch --no-name HEAD)
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Notify deployment failure
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "RUM sdk 部署通知",
                "text": "### ❌ RUM sdk 部署失败 \n\n---\n\n 🔖 分支: ${{ github.ref }}\n\n 📝 提交信息: [${{ github.event.head_commit.message }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n\n 👨‍💻 提交者: ${{ github.actor }}\n\n 🚀 [查看部署详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
