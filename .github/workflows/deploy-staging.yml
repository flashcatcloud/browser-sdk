name: Staging Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "yes" to confirm deployment'
        required: true
        default: 'no'

env:
  NODE_VERSION: '23.11.1'
  BUILD_MODE: release

jobs:
  validate-confirmation:
    name: Validate manual confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "yes" ]; then
            echo 'Deployment blocked: confirm_deploy must be exactly "yes".'
            exit 1
          fi

  preflight:
    name: Staging preflight
    needs: validate-confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run staging checks
        run: |
          yarn build
          yarn lint
          yarn typecheck
          yarn test:unit --single-run
          yarn test:compat:ssr

      - name: Build bundle
        run: yarn build:bundle

      - name: Verify ES5 compatibility of the legacy bundle
        run: yarn test:compat:es5

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-bundles
          path: packages/*/bundle/**
          if-no-files-found: error

  deploy-staging:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download verified bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-bundles
          path: packages

      - name: Get version
        run: |
          FULL_VERSION=$(node -p "require('./lerna.json').version")
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Deploy to staging
        run: node ./scripts/deploy/deploy-oss.js staging v${VERSION}
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}
