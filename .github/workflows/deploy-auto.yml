name: Automatic Deployment

on:
  push:
    tags:
      - 'v*' # 当推送带有 v 前缀的标签时触发

# No job here asks for `fetch-tags`. This workflow is triggered *by* the tag, so the tag is the ref
# being checked out and is already present for `check-release.js`. Asking for `fetch-tags` makes
# checkout fetch both the commit and the tag into the same `refs/tags/*`, which git refuses.

env:
  NODE_VERSION: '23.11.1'
  BUILD_MODE: release

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate tag matches package version
        run: |
          FULL_VERSION=$(node -p "require('./lerna.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FULL_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match lerna.json version $FULL_VERSION"
            exit 1
          fi

      - name: Check release metadata
        run: node scripts/release/check-release.js

      - name: Run release checks
        run: |
          yarn format
          yarn build
          yarn lint
          node scripts/check-packages.js
          yarn typecheck
          yarn test:unit --single-run
          yarn test:compat:tsc
          yarn test:compat:ssr

      - name: Build bundle
        run: yarn build:bundle

      - name: Verify ES5 compatibility of the legacy bundle
        run: yarn test:compat:es5

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: packages/*/bundle/**
          if-no-files-found: error

  deploy-prod:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download verified bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: packages

      - name: Get version
        run: |
          FULL_VERSION=$(node -p "require('./lerna.json').version")
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Deploy to prod
        run: node ./scripts/deploy/deploy-oss.js prod v${VERSION}
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY: ${{ secrets.OSS_ACCESS_KEY }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_SECRET_KEY: ${{ secrets.OSS_SECRET_KEY }}

  publish-npm:
    needs: deploy-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish to NPM
        run: node ./scripts/deploy/publish-npm.js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-success:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Build notification payload
        id: payload
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUBJECT="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          BODY=$(jq -nc \
            --arg ref "${GITHUB_REF}" \
            --arg subject "${SUBJECT}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg run_url "${RUN_URL}" \
            '{msgtype: "markdown", markdown: {title: "RUM sdk 部署通知", text: ("### ✅ RUM sdk 部署成功\n\n---\n\n 🔖 分支: " + $ref + "\n\n 📝 提交信息: [" + $subject + "](" + $commit_url + ")\n\n 👨‍💻 提交者: " + $actor + "\n\n 🚀 [查看部署详情](" + $run_url + ")")}}')
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Notify deployment success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: ${{ steps.payload.outputs.body }}

      - name: Notify secondary DingTalk group on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: ${{ steps.payload.outputs.body }}

  notify-failure:
    needs: [preflight, deploy-prod, publish-npm]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Build notification payload
        id: payload
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUBJECT="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          BODY=$(jq -nc \
            --arg ref "${GITHUB_REF}" \
            --arg subject "${SUBJECT}" \
            --arg commit_url "${COMMIT_URL}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg run_url "${RUN_URL}" \
            '{msgtype: "markdown", markdown: {title: "RUM sdk 部署通知", text: ("### ❌ RUM sdk 部署失败\n\n---\n\n 🔖 分支: " + $ref + "\n\n 📝 提交信息: [" + $subject + "](" + $commit_url + ")\n\n 👨‍💻 提交者: " + $actor + "\n\n 🚀 [查看部署详情](" + $run_url + ")")}}')
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Notify deployment failure
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: 'true'
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: ${{ steps.payload.outputs.body }}
